<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BetriebsApp 1.0.16 Test</title><style>body{font-family:system-ui;background:#f3f6f2;color:#1f2d23;display:grid;place-items:center;min-height:100vh;margin:0}.c{background:#fff;padding:24px;border-radius:14px;max-width:520px;border:1px solid #d9e2db}button{background:#315f3a;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700}</style></head><body><div class="c"><h2>🌱 BetriebsApp 1.0.16 – Test</h2><p>Diese Testversion verwendet einen getrennten lokalen Datenspeicher. Deine normale 1.0.15 bleibt unverändert.</p><button id="go">Testversion starten</button><p id="s"></p></div><script>document.getElementById('go').onclick=async()=>{const s=document.getElementById('s');if(!('serviceWorker'in navigator)){s.textContent='Dieser Browser unterstützt den Testmodus nicht.';return}try{s.textContent='Testumgebung wird vorbereitet …';const r=await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});await navigator.serviceWorker.ready;if(!navigator.serviceWorker.controller){location.reload();return}location.href='./index.html?test=1'}catch(e){s.textContent='Fehler beim Start: '+e.message}}</script></body></html>
